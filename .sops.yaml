# Qui peut déchiffrer quels secrets (voir secrets/README.md). Clés PUBLIQUES uniquement.
# NixKS : à remplacer après son installation, puis `sops updatekeys`.
keys:
  # Ta clé personnelle (pour éditer les secrets depuis ton poste ou un serveur).
  - &admin age1gqlz67qlc86qw3e50dvkk97th34phaw53txecv6sc9ugt049mexqllmckt
  # Clés des machines, dérivées de leur clé SSH d'hôte après installation.
  - &atom age14lrswludpckq93r42w0ehczuav57gm43g6h5cfnljyv8cq9gsc0q3wruy7
  - &NixKS age1CHANGE_ME_cle_NixKS
creation_rules:
  - path_regex: secrets/atom\.yaml$
    key_groups:
      - age: [*admin, *atom]
  - path_regex: secrets/NixKS\.yaml$
    key_groups:
      - age: [*admin, *NixKS]
